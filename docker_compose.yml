version: "3.8"

services:

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  redis:
    image: redis
    ports:
      - "6379:6379"

'''Need to Run this Code 
docker-compose up --build
